name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinyboard-backend
    env:
      APP_DEBUG: "false"
      DB_PATH: /tmp/tinyboard-test.sqlite
      INTERNAL_API_KEY: change-me
      INTERNAL_API_ALLOWED_HOSTS: app.localhost,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SESSION_TTL_HOURS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: composer test

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinyboard-frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      INTERNAL_API_KEY: test-internal-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build-prod-images:
    name: Build prod images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./tinyboard-backend
          file: ./tinyboard-backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tinyboard-backend:latest
            ghcr.io/${{ github.repository_owner }}/tinyboard-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./tinyboard-frontend
          file: ./tinyboard-frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tinyboard-frontend:latest
            ghcr.io/${{ github.repository_owner }}/tinyboard-frontend:${{ github.sha }}
